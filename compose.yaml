name: ship-shape

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ship-shape:${SHIP_SHAPE_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 8787
      REDIS_URL: redis://redis:6379
      REQUIRE_GITHUB_OAUTH: "1"
      REQUIRE_REDIS: "1"
      TRUST_PROXY: "1"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SHIP_SHAPE_PORT:-8787}:8787"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${APP_MEMORY_LIMIT:-512m}
    cpus: ${APP_CPU_LIMIT:-0.50}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - session_data:/data
    expose:
      - "6379"
    security_opt:
      - no-new-privileges:true
    mem_limit: ${REDIS_MEMORY_LIMIT:-192m}
    cpus: ${REDIS_CPU_LIMIT:-0.25}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  session_data:
